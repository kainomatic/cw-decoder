# Nur Werkzeug-Konfiguration; installiert wird über requirements*.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    # Gruppen für die CI-Auswahl nach geänderten Dateien (tools/ci_select.py, ADR-0029)
    "gui: Oberfläche, braucht ein Display (ohne Display übersprungen; GUI-Rauchtest, Fenster-Tests)",
    "decoder: Decoder-Kern, läuft länger (Matrix, echte Aufnahmen, Blockgröße, Vertrauen, erste Zeichen)",
]
