# CW Decoder — Copyright (C) 2026 DF1DS (kainomatic) — SPDX-License-Identifier: GPL-3.0-or-later
# Release bei Tag-Push (ADR-0002, ADR-0014):
#   vX.Y.Z        Stable-Release  (nur nach Freigabe durch DF1DS)
#   vX.Y.Z-betaN  Beta-Pre-Release (darf Claude Code setzen)
# __version__ im Repo trägt immer die Ziel-Stable-Nummer X.Y.Z und
# CHANNEL = "stable". Für Betas patcht tools/release_tools.py beides im
# Build (kein Commit). Normale Pushes testet ci.yml nach geänderten Dateien;
# vor dem Bundle läuft hier immer der volle Testlauf auf dem getaggten Commit
# (Windows und Linux, alle Marker, ADR-0029).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tests:
    name: Volllauf
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  release:
    name: Build und Release (${{ github.ref_name }})
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      # Tag prüfen, Versions-Sync (Basis des Tags == __version__), bei Beta
      # CHANNEL und __version__ ephemer patchen; setzt CHANNEL, IS_PRERELEASE,
      # APP_VERSION, FULL_VERSION, ISS_FILE, SETUP_FILE.
      - name: Tag und Version prüfen
        run: python tools/release_tools.py prepare --tag "${{ github.ref_name }}" --github-env "$env:GITHUB_ENV"

      - name: Icon erzeugen
        run: python tools/make_icon.py

      - name: PyInstaller-Bundle bauen
        run: pyinstaller --noconfirm cwdecoder.spec

      - name: Bundle prüfen (Version und Offline-Decodierung)
        shell: pwsh
        run: |
          $exe = "dist\CWDecoder\CWDecoder.exe"
          Start-Process $exe -ArgumentList "--version" -Wait -NoNewWindow -RedirectStandardOutput version.txt -RedirectStandardError version-err.txt
          $v = (Get-Content version.txt -Raw).Trim()
          Write-Host "Bundle meldet: $v"
          if ($v -ne "CW Decoder $env:FULL_VERSION ($env:CHANNEL)") { Write-Error "Falsche Version im Bundle: $v"; exit 1 }
          python -m cwdecoder.gen "CQ TEST DE DF1DS K" -o smoke.wav --wpm 25 --snr 20 --seed 1
          Start-Process $exe -ArgumentList "--decode","smoke.wav" -Wait -NoNewWindow -RedirectStandardOutput decode.txt -RedirectStandardError decode-err.txt
          Get-Content decode-err.txt
          $out = Get-Content decode.txt -Raw -Encoding utf8
          Write-Host $out
          if ($out -notmatch "CQ TEST DE DF1DS K") { Write-Error "Bundle decodiert nicht"; exit 1 }

      - name: Bundle prüfen (DXCC-Daten, SCP, Wortschatz, --dxcc, --scp)
        shell: pwsh
        run: |
          $exe = "dist\CWDecoder\CWDecoder.exe"
          $data = Get-ChildItem dist\CWDecoder -Recurse -Directory -Filter data |
            Where-Object { $_.FullName -like "*\cwdecoder\data" } | Select-Object -First 1
          if (-not $data) { Write-Error "cwdecoder\data fehlt im Bundle"; exit 1 }
          foreach ($f in "cty.dat", "cty_copyright.txt", "dxcc_table.json", "flags\de.png", "master.scp", "qso_words.txt") {
            if (-not (Test-Path (Join-Path $data.FullName $f))) { Write-Error "$f fehlt im Bundle"; exit 1 }
          }
          Start-Process $exe -ArgumentList "--dxcc","DJ7PR" -Wait -NoNewWindow -RedirectStandardOutput dxcc.txt -RedirectStandardError dxcc-err.txt
          Get-Content dxcc-err.txt
          $d = (Get-Content dxcc.txt -Raw -Encoding utf8).Trim()
          Write-Host "Bundle meldet: $d"
          if ($d -ne "DJ7PR: Deutschland (DL, EU, CQ 14, ITU 28)") { Write-Error "--dxcc falsch: $d"; exit 1 }
          Start-Process $exe -ArgumentList "--scp","OY1CT" -Wait -NoNewWindow -RedirectStandardOutput scp.txt -RedirectStandardError scp-err.txt
          Get-Content scp-err.txt
          $s = (Get-Content scp.txt -Raw -Encoding utf8).Trim()
          Write-Host "Bundle meldet: $s"
          if ($s -ne "OY1CT: bekannt") { Write-Error "--scp falsch: $s"; exit 1 }

      # Handbuch als PDF (ADR-0027): Chromium über Playwright, nur im Build
      - name: Handbuch bauen
        shell: pwsh
        run: |
          pip install playwright pypdf
          python -m playwright install chromium
          python tools/build_handbook.py --version "$env:FULL_VERSION" --out dist\CW-Decoder-Handbuch.pdf
          if ($LASTEXITCODE -ne 0) { Write-Error "Handbuch nicht gebaut"; exit 1 }
          Copy-Item dist\CW-Decoder-Handbuch.pdf "CW-Decoder-Handbuch-${{ github.ref_name }}.pdf"
          Get-Item "CW-Decoder-Handbuch-${{ github.ref_name }}.pdf" | Format-List Name, Length

      - name: Inno Setup installieren
        run: choco install innosetup --no-progress -y

      - name: Installer bauen
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAPP_VERSION=$env:APP_VERSION" $env:ISS_FILE
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC fehlgeschlagen ($LASTEXITCODE)"; exit $LASTEXITCODE }
          Get-Item $env:SETUP_FILE | Format-List Name, Length

      - name: Release-Notes aus CHANGELOG.md
        run: python tools/release_tools.py notes --tag "${{ github.ref_name }}" -o release_notes.md

      - name: GitHub-Release anlegen
        uses: softprops/action-gh-release@v3
        with:
          name: CW Decoder ${{ env.FULL_VERSION }}
          body_path: release_notes.md
          prerelease: ${{ env.IS_PRERELEASE }}
          files: |
            ${{ env.SETUP_FILE }}
            CW-Decoder-Handbuch-${{ github.ref_name }}.pdf
          fail_on_unmatched_files: true
